# First enable this HTTP host, then let certbot --apache add HTTPS and redirect.
<VirtualHost *:80>
    ServerName mcp.leadprogressai.app

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass /mcp http://127.0.0.1:8001/mcp connectiontimeout=5 timeout=300
    ProxyPassReverse /mcp http://127.0.0.1:8001/mcp

    ErrorLog ${APACHE_LOG_DIR}/mcp_error.log
    CustomLog ${APACHE_LOG_DIR}/mcp_access.log combined
</VirtualHost>
